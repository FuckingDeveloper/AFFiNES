query trackWorkActivity(
  $workspaceId: String!
  $taskKey: String
  $first: Int = 20
  $after: String
) {
  trackWorkActivity(
    workspaceId: $workspaceId
    taskKey: $taskKey
    first: $first
    after: $after
  ) {
    items {
      id
      eventType
      title
      url
      authorName
      repositoryName
      createdAt
    }
    nextCursor
    hasNextPage
  }
}
