query developmentIntegrations($workspaceId: String!) {
  workspace(id: $workspaceId) {
    developmentIntegrations {
      id
      workspaceId
      provider
      name
      baseUrl
      enabled
      hasToken
      hasWebhookSecret
      webhookUrl
      createdAt
      updatedAt
      repositories {
        id
        externalId
        name
        fullName
        webUrl
        defaultBranch
        enabled
      }
    }
  }
}
