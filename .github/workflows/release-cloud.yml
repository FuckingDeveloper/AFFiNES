name: Release Cloud

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      app-version:
        required: true
        type: string
      git-short-hash:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and scan the candidate image only; do NOT deploy or promote'
        required: true
        type: boolean
        default: true
      build-type:
        description: 'Candidate build type for the dry run (no promotion happens)'
        required: true
        type: choice
        options:
          - canary
          - beta
          - stable

permissions:
  contents: 'write'
  id-token: 'write'
  packages: 'write'

jobs:
  prepare-dispatch:
    name: Prepare dispatch inputs
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      BUILD_TYPE: ${{ steps.derive.outputs.BUILD_TYPE }}
      APP_VERSION: ${{ steps.derive.outputs.APP_VERSION }}
      GIT_SHORT_HASH: ${{ steps.derive.outputs.GIT_SHORT_HASH }}
    steps:
      - name: Derive candidate values from the exact checked-out SHA
        id: derive
        run: |
          set -euo pipefail
          sha12="${{ github.sha }}"
          sha12="${sha12:0:12}"
          echo "BUILD_TYPE=${{ inputs.build-type }}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=0.0.0-dryrun.$sha12" >> "$GITHUB_OUTPUT"
          echo "GIT_SHORT_HASH=$sha12" >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Security CI dry run
          Derived from the exact checked-out SHA:
          - candidate tag: \`ghcr.io/toeverything/affine:${{ inputs.build-type }}-$sha12\`
          - app version (dry-run, never promoted): \`0.0.0-dryrun.$sha12\`
          - deploy job: SKIPPED (dry-run=true)
          EOF

  build-images:
    name: Build Images
    needs:
      - prepare-dispatch
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      build-type: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-dispatch.outputs.BUILD_TYPE || inputs.build-type }}
      app-version: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-dispatch.outputs.APP_VERSION || inputs.app-version }}
      git-short-hash: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-dispatch.outputs.GIT_SHORT_HASH || inputs.git-short-hash }}

  deploy:
    name: Deploy to cluster
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run != true }}
    environment: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-dispatch.outputs.BUILD_TYPE || inputs.build-type }}
    needs:
      - build-images
      - prepare-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy to ${{ inputs.build-type }}
        uses: ./.github/actions/deploy
        with:
          gcp-project-number: ${{ secrets.GCP_PROJECT_NUMBER }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}
          service-account: ${{ secrets.GCP_HELM_DEPLOY_SERVICE_ACCOUNT }}
          cluster-name: ${{ secrets.GCP_CLUSTER_NAME }}
          cluster-location: ${{ secrets.GCP_CLUSTER_LOCATION }}
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          APP_VERSION: ${{ inputs.app-version }}
          GIT_SHORT_HASH: ${{ inputs.git-short-hash }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CANARY_DEPLOY_HOST: ${{ secrets.CANARY_DEPLOY_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          GCLOUD_CONNECTION_NAME: ${{ secrets.GCLOUD_CONNECTION_NAME }}
          REDIS_SERVER_HOST: ${{ secrets.REDIS_SERVER_HOST }}
          REDIS_SERVER_PASSWORD: ${{ secrets.REDIS_SERVER_PASSWORD }}
          CLOUD_SQL_IAM_ACCOUNT: ${{ secrets.CLOUD_SQL_IAM_ACCOUNT }}
          APP_IAM_ACCOUNT: ${{ secrets.APP_IAM_ACCOUNT }}
          STATIC_IP_NAME: ${{ secrets.STATIC_IP_NAME }}
          AFFINE_INDEXER_SEARCH_PROVIDER: ${{ secrets.AFFINE_INDEXER_SEARCH_PROVIDER }}
          AFFINE_INDEXER_SEARCH_ENDPOINT: ${{ secrets.AFFINE_INDEXER_SEARCH_ENDPOINT }}
          AFFINE_INDEXER_SEARCH_API_KEY: ${{ secrets.AFFINE_INDEXER_SEARCH_API_KEY }}
