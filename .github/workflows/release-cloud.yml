name: Release Cloud

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      app-version:
        required: true
        type: string
      git-short-hash:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and scan the candidate image only; do NOT deploy or promote'
        required: true
        type: boolean
        default: true
      build-type:
        description: 'Candidate build type for the dry run (no promotion happens)'
        required: true
        type: choice
        options:
          - canary
          - beta
          - stable

permissions:
  contents: 'write'
  id-token: 'write'
  packages: 'write'

jobs:
  resolve-inputs:
    name: Resolve candidate inputs
    runs-on: ubuntu-latest
    outputs:
      BUILD_TYPE: ${{ steps.resolve.outputs.BUILD_TYPE }}
      APP_VERSION: ${{ steps.resolve.outputs.APP_VERSION }}
      GIT_SHORT_HASH: ${{ steps.resolve.outputs.GIT_SHORT_HASH }}
    steps:
      - name: Resolve build-type / app-version / git-short-hash
        id: resolve
        env:
          CALL_BUILD_TYPE: ${{ inputs.build-type }}
          CALL_APP_VERSION: ${{ inputs.app-version }}
          CALL_GIT_SHORT_HASH: ${{ inputs.git-short-hash }}
          DISPATCH_BUILD_TYPE: ${{ inputs.build-type }}
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha12="${GITHUB_SHA_FULL:0:12}"
            build_type="$DISPATCH_BUILD_TYPE"
            app_version="0.0.0-dryrun.$sha12"
            git_short_hash="$sha12"
            printf '%s\n' \
              '## Security CI image dry run' \
              "- candidate tag: \`ghcr.io/toeverything/affine:$build_type-$sha12\`" \
              "- app version (dry-run, never promoted): \`0.0.0-dryrun.$sha12\`" \
              '- deploy: IMPOSSIBLE on workflow_dispatch' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            build_type="$CALL_BUILD_TYPE"
            app_version="$CALL_APP_VERSION"
            git_short_hash="$CALL_GIT_SHORT_HASH"
          fi
          if [ -z "$build_type" ] || [ -z "$app_version" ] || [ -z "$git_short_hash" ]; then
            echo "resolve-inputs failed: one or more candidate inputs are empty"
            exit 1
          fi
          echo "BUILD_TYPE=$build_type" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$app_version" >> "$GITHUB_OUTPUT"
          echo "GIT_SHORT_HASH=$git_short_hash" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build Images
    needs:
      - resolve-inputs
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      build-type: ${{ needs.resolve-inputs.outputs.BUILD_TYPE }}
      app-version: ${{ needs.resolve-inputs.outputs.APP_VERSION }}
      git-short-hash: ${{ needs.resolve-inputs.outputs.GIT_SHORT_HASH }}

  deploy:
    name: Deploy to cluster
    if: ${{ github.event_name != 'workflow_dispatch' }}
    environment: ${{ needs.resolve-inputs.outputs.BUILD_TYPE }}
    needs:
      - build-images
      - resolve-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy to ${{ inputs.build-type }}
        uses: ./.github/actions/deploy
        with:
          gcp-project-number: ${{ secrets.GCP_PROJECT_NUMBER }}
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}
          service-account: ${{ secrets.GCP_HELM_DEPLOY_SERVICE_ACCOUNT }}
          cluster-name: ${{ secrets.GCP_CLUSTER_NAME }}
          cluster-location: ${{ secrets.GCP_CLUSTER_LOCATION }}
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          APP_VERSION: ${{ inputs.app-version }}
          GIT_SHORT_HASH: ${{ inputs.git-short-hash }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CANARY_DEPLOY_HOST: ${{ secrets.CANARY_DEPLOY_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          GCLOUD_CONNECTION_NAME: ${{ secrets.GCLOUD_CONNECTION_NAME }}
          REDIS_SERVER_HOST: ${{ secrets.REDIS_SERVER_HOST }}
          REDIS_SERVER_PASSWORD: ${{ secrets.REDIS_SERVER_PASSWORD }}
          CLOUD_SQL_IAM_ACCOUNT: ${{ secrets.CLOUD_SQL_IAM_ACCOUNT }}
          APP_IAM_ACCOUNT: ${{ secrets.APP_IAM_ACCOUNT }}
          STATIC_IP_NAME: ${{ secrets.STATIC_IP_NAME }}
          AFFINE_INDEXER_SEARCH_PROVIDER: ${{ secrets.AFFINE_INDEXER_SEARCH_PROVIDER }}
          AFFINE_INDEXER_SEARCH_ENDPOINT: ${{ secrets.AFFINE_INDEXER_SEARCH_ENDPOINT }}
          AFFINE_INDEXER_SEARCH_API_KEY: ${{ secrets.AFFINE_INDEXER_SEARCH_API_KEY }}
