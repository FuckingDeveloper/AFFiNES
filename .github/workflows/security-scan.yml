name: Security Scan

# Source-level security gates for TrackWork (OpenSpec 1.11/1.12):
# - dependency vulnerability scanning (OSV-Scanner v2.5.1 against yarn.lock,
#   identity-scoped baseline; the REAL scan runs the pinned official binary)
# - secret scanning (Gitleaks v8.24.3, pinned binary, value-level allowlist)
# Static analysis (CodeQL) runs in build-test.yml (analyze job) with an
# explicit SARIF security-result gate.
# Reusable via workflow_call so release.yml runs the EXACT-commit gates as a
# required dependency of the deploy/promotion jobs.
# Policy: docs/security-ci.md. All binary downloads verify official
# SHA256SUMS; no curl|bash installers; no literal secrets in tracked source
# (self-test secrets are generated at runtime in /tmp).

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_amd64
          curl -fsSL -o SHA256SUMS \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_SHA256SUMS
          grep 'gitleaks_8.24.3_linux_amd64' SHA256SUMS | sha256sum -c -
          chmod +x gitleaks

      - name: Scan tracked repository content (tree-scoped)
        run: |
          set -euo pipefail
          ./gitleaks detect --source . --config .gitleaks.toml --exit-code 1 --no-banner --no-git

      - name: Self-test (runtime synthetic secret must be detected)
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-self-test
          key="sk-live-$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          printf 'API_KEY=%s\n' "$key" > /tmp/gitleaks-self-test/secret.txt
          set +e
          ./gitleaks detect --source /tmp/gitleaks-self-test --no-git --no-banner --exit-code 1
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "self-test passed: synthetic secret detected"
            exit 0
          fi
          echo "self-test failed: synthetic secret was NOT detected"
          exit 1

      - name: Allowlist bypass regression
        run: |
          set -euo pipefail
          python3 .security/gitleaks-bypass-selftest.py ./gitleaks "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.gitleaks.toml"

  dependency-scan:
    name: Dependency scan (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup OSV-Scanner (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          curl -fsSL -o SHA256SUMS \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_SHA256SUMS
          grep 'osv-scanner_linux_amd64' SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan lockfile (full OSV report)
        run: |
          set -euo pipefail
          ./osv-scanner --format json --output osv-report.json --lockfile yarn.lock

      - name: Fail on NEW Critical/High advisories vs baseline
        run: |
          set -euo pipefail
          python3 .security/check-osv-baseline.py .security/osv-baseline.json osv-report.json

      - name: OSV baseline identity self-test
        run: |
          set -euo pipefail
          python3 .security/check-osv-baseline.py --selftest

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-report
          path: osv-report.json

      - name: OSV self-test (known advisory fixture must be reported)
        run: |
          set -euo pipefail
          set +e
          ./osv-scanner --format json .security/self-test/package-lock.json > /tmp/osv-self.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "self-test failed: osv-scanner errored on the fixture"
            exit 1
          fi
          findings=$(python3 -c \
            "import json; d=json.load(open('/tmp/osv-self.json')); \
             print(sum(len(p.get('vulnerabilities', [])) for r in d.get('results', []) for p in r.get('packages', [])))")
          if [ "$findings" -gt 0 ]; then
            echo "self-test passed: fixture reported $findings known advisories"
            exit 0
          fi
          echo "self-test failed: fixture with a known advisory was not reported"
          exit 1