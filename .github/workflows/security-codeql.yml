name: Security CodeQL

# Reusable CodeQL security analysis with an explicit SARIF security-result
# gate (OpenSpec 1.12 static-analysis half). Single source of truth used by
# - build-test.yml (PR + push to canary/beta/stable branches)
# - release.yml (the EXACT release SHA, as a required dependency of
#   cloud/image/desktop/mobile release jobs)
# Policy: docs/security-ci.md. The gate runs on local SARIF output and does
# not require GitHub Advanced Security; SARIF upload remains a reporting
# surface where supported.

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}/${{ matrix.project }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=14384
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']
        project: ['affine', 'blocksuite']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          source-root: ${{ matrix.project == 'affine' && '.' || 'blocksuite' }}

      - name: Delete blocksuite before codeql analysis
        if: ${{ matrix.project == 'affine' }}
        run: rm -rf blocksuite

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
          upload: true

      - name: CodeQL security-result gate
        run: |
          set -euo pipefail
          sarif_file=$(find sarif-results -maxdepth 1 -name '*.sarif' | head -1)
          if [ -z "$sarif_file" ]; then
            echo "no SARIF produced by the analysis; treating as gate failure"
            exit 1
          fi
          python3 .security/check-codeql-sarif.py "$sarif_file" .security/codeql-baseline.json

      - name: CodeQL security-result gate self-test
        run: |
          set -euo pipefail
          python3 .security/check-codeql-sarif.py --selftest